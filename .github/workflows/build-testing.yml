name: Build testing

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

# Build-only: lints, type-checks, tests and builds, then uploads an unsigned
# artifact. It must never reference secrets or publish anything. Publishing
# lives in main-deploy.yml.
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout lxd-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on pull_request events, which falls back to the PR ref.
          ref: ${{ github.event.inputs.branch }}
          path: lxd-tools

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install lxd-tools dependencies
        working-directory: lxd-tools
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Verify pinned release tools install
        # No secrets here. Fails the PR if .github/release-tools/package-lock.json is
        # out of sync, or the tools stop resolving, instead of failing during a deploy.
        working-directory: lxd-tools/.github/release-tools
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/web-ext --version
          test -x ./node_modules/.bin/crx3

      - name: Run ESLint
        working-directory: lxd-tools
        run: |
          if npm run lint --if-present; then
            echo "✅ ESLint passed"
          else
            echo "❌ ESLint failed"
            exit 1
          fi

      - name: Check TypeScript types
        working-directory: lxd-tools
        run: |
          if npm run typecheck --if-present; then
            echo "✅ TypeScript compilation passed"
          else
            echo "❌ TypeScript compilation failed"
            exit 1
          fi

      - name: Run tests
        working-directory: lxd-tools
        run: npm test

      - name: Debug - Check ueu-canvas installation
        working-directory: lxd-tools
        run: |
          echo "Checking node_modules..."
          ls -la node_modules/@ueu/ || echo "@ueu directory missing"
          ls -la node_modules/@ueu/ueu-canvas/ || echo "ueu-canvas missing"
          ls -la node_modules/@ueu/ueu-canvas/dist/ || echo "dist missing"
          echo "--- package.json dependency ---"
          cat package.json | grep -A2 ueu-canvas

      - name: Build lxd-tools
        working-directory: lxd-tools
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lxd-tools
          path: dist
          if-no-files-found: "error"
          retention-days: 30

      - name: Comment download link on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: build
          message: "✅ Build artifact available: [Download here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
