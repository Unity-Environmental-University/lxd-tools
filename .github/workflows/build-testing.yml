name: Build testing

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          path: lxd-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install lxd-tools dependencies
        working-directory: lxd-tools
        run: |
          npm config set registry https://registry.npmjs.org/
          npm cache clean --force
          npm install
          npm install @testing-library/react --save-dev

      # Build-only: this workflow must never use the production signing keys,
      # submit to AMO, or upload anything to the auto-update bucket. Releases
      # are published only by main-deploy.yml. The output here is an unsigned
      # build for loading unpacked / as a temporary add-on.
      # This file deliberately replaces the old manual-deploy.yml: do not
      # recreate a workflow at that path, or older branches that still carry
      # the publishing version become dispatchable again.
      - name: Build extension
        working-directory: lxd-tools
        run: npm run build

      - name: Upload unsigned test build
        uses: actions/upload-artifact@v4
        with:
          name: lxd-tools-test-build-${{ github.run_number }}
          path: |
            dist/
            !dist/updates.json
            !dist/update.xml
          if-no-files-found: "error"
          retention-days: 7
