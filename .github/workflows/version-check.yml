name: Version Check

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/release-tools/**'

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Check version is bumped from main
        run: |
          PR_VERSION=$(node -p 'require("./package.json").version')
          MAIN_VERSION=$(git fetch origin main && git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync("/dev/stdin","utf8")).version')
          echo "PR version:   $PR_VERSION"
          echo "Main version: $MAIN_VERSION"
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "ERROR: package.json version ($PR_VERSION) must be bumped before merging to main."
            exit 1
          fi

      - name: Check package-lock.json version matches package.json
        # Fix with: npm run bump -- <version>  (or: npm install --package-lock-only)
        run: |
          node -e '
            const pkg = require("./package.json").version;
            const lock = require("./package-lock.json");
            const top = lock.version;
            const root = lock.packages && lock.packages[""] && lock.packages[""].version;
            console.log(`package.json: ${pkg}, lock top-level: ${top}, lock root package: ${root}`);
            if (top !== pkg || root !== pkg) {
              console.error("ERROR: package-lock.json version fields must match package.json. Run: npm run bump -- " + pkg);
              process.exit(1);
            }
          '
