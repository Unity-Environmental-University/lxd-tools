name: lxd-tools build

on:
  pull_request:
    branches:
      - "**"

permissions:
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout lxd-tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: lxd-tools

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install lxd-tools dependencies
        working-directory: lxd-tools
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Run ESLint
        working-directory: lxd-tools
        run: |
          if npm run lint --if-present; then
            echo "✅ ESLint passed"
          else
            echo "❌ ESLint failed"
            exit 1
          fi

      - name: Check TypeScript types
        working-directory: lxd-tools
        run: |
          if npm run typecheck --if-present; then
            echo "✅ TypeScript compilation passed"
          else
            echo "❌ TypeScript compilation failed"
            exit 1
          fi

      - name: Run tests
        working-directory: lxd-tools
        run: npm test

      - name: Debug - Check ueu-canvas installation
        working-directory: lxd-tools
        run: |
          echo "Checking node_modules..."
          ls -la node_modules/@ueu/ || echo "@ueu directory missing"
          ls -la node_modules/@ueu/ueu-canvas/ || echo "ueu-canvas missing"
          ls -la node_modules/@ueu/ueu-canvas/dist/ || echo "dist missing"
          echo "--- package.json dependency ---"
          cat package.json | grep -A2 ueu-canvas

      - name: Build lxd-tools
        working-directory: lxd-tools
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lxd-tools
          path: dist
          if-no-files-found: "error"
          retention-days: 30

      - name: Comment download link on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: build
          message: "✅ Build artifact available: [Download here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
