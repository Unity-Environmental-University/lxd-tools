name: Version Check

on:
  pull_request:
    branches:
      - main
    # ONLY run if ONLY docs/yaml change
    paths-ignore:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - name: Bypass Check
        run: echo "Docs-only PR detected. Bypassing version bump requirement."
