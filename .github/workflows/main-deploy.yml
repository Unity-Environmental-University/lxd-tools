name: Deploy Extension Updates

# Publishes the extension. This is the only workflow that touches production
# secrets.
#
# - push to main: runs when a PR is merged (branch protection should require a
#   PR for main). Docs/yaml-only changes, and changes only under
#   .github/release-tools/, are skipped.
# - workflow_dispatch: manual fallback, e.g. to re-run a failed deploy. Runs
#   the tip of main only.
#
# Triggers are push/dispatch rather than pull_request so that github.ref is
# refs/heads/main, which lets the production environment be limited to main.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/release-tools/**'
  workflow_dispatch:

# Never run two deploys at once (e.g. a push and a manual run).
concurrency:
  group: deploy-extension
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout lxd-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lxd-tools
          fetch-tags: true
          # Keep the write-scoped token out of .git/config while dependency and
          # build code runs; the tag step below authenticates on its own.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: lxd-tools
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Install release tools
        # crx3 and web-ext at the exact versions in this folder's package-lock.json.
        # They live apart from the extension's package.json so its overrides do not
        # apply to them, and none of their dependencies need install scripts.
        working-directory: lxd-tools/.github/release-tools
        run: npm ci --ignore-scripts

      - name: Get version and check for duplicates
        id: get_version
        working-directory: lxd-tools
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Ask origin for the tag instead of listing local tags: the checkout is
          # shallow (depth 1), so older release tags are not present locally and
          # `git tag` would never see them. ls-remote exits 0 if the tag exists,
          # 2 if it does not, and anything else if origin could not be queried.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1 || rc=$?
          case $rc in
            0) echo "ERROR: Version $VERSION has already been deployed (tag exists on origin). Update package.json version before merging."; exit 1 ;;
            2) echo "OK: no tag $VERSION on origin" ;;
            *) echo "ERROR: could not check origin for tag $VERSION (git ls-remote exit $rc)"; exit 1 ;;
          esac

      - name: Build extension
        working-directory: lxd-tools
        run: npm run build

      - name: Pack Chrome extension
        working-directory: lxd-tools
        env:
          CHROME_KEY_PEM_B64: ${{ secrets.CHROME_KEY_PEM_B64 }}
        run: |
          # The signing key exists only for the duration of this step, outside the
          # checkout and dist, and is removed even if packing fails.
          umask 077
          KEY_FILE="$RUNNER_TEMP/chrome-key.pem"
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          echo "$CHROME_KEY_PEM_B64" | base64 -d > "$KEY_FILE"
          # Fail clearly if the secret is unset rather than handing crx3 an empty key file.
          if [ ! -s "$KEY_FILE" ]; then echo "ERROR: Chrome signing key is empty" && exit 1; fi
          .github/release-tools/node_modules/.bin/crx3 ../dist -p "$KEY_FILE" -o "../dist/lxd-extension-${{ steps.get_version.outputs.version }}.crx"

      - name: Sign Firefox extension
        working-directory: lxd-tools
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          .github/release-tools/node_modules/.bin/web-ext sign \
            --source-dir ../dist \
            --api-key $WEB_EXT_API_KEY \
            --api-secret $WEB_EXT_API_SECRET \
            --channel unlisted \
            --artifacts-dir ../dist \
            --ignore-files "*.crx" "*.xpi"
          SIGNED=$(find ../dist -maxdepth 1 -name "*.xpi" ! -name "lxd-extension-*.xpi" | head -1)
          mv "$SIGNED" "../dist/lxd-extension-${{ steps.get_version.outputs.version }}.xpi"

      - name: Find necessary files
        id: find_files
        run: |
          XPI=$(find dist/ -maxdepth 1 -name "*.xpi" -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          CRX=$(find dist/ -maxdepth 1 -name "lxd-extension-*.crx" | head -1)
          UPDATES_JSON="dist/updates.json"
          UPDATE_XML="dist/update.xml"

          if [ -z "$XPI" ]; then echo "ERROR: .xpi not found" && exit 1; fi
          if [ -z "$CRX" ]; then echo "ERROR: .crx not found" && exit 1; fi
          if [ ! -f "$UPDATES_JSON" ]; then echo "ERROR: updates.json not found" && exit 1; fi
          if [ ! -f "$UPDATE_XML" ]; then echo "ERROR: update.xml not found" && exit 1; fi

          echo "xpi=$XPI" >> $GITHUB_OUTPUT
          echo "crx=$CRX" >> $GITHUB_OUTPUT
          echo "updates_json=$UPDATES_JSON" >> $GITHUB_OUTPUT
          echo "update_xml=$UPDATE_XML" >> $GITHUB_OUTPUT
          echo "Found: $XPI, $CRX, $UPDATES_JSON, $UPDATE_XML"

      - name: Send files to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp ${{ steps.find_files.outputs.xpi }} s3://${{ secrets.R2_BUCKET_NAME }}/ --endpoint-url $R2_ENDPOINT --content-type "application/x-xpinstall"
          aws s3 cp ${{ steps.find_files.outputs.crx }} s3://${{ secrets.R2_BUCKET_NAME }}/ --endpoint-url $R2_ENDPOINT --content-type "application/x-chrome-extension"
          aws s3 cp ${{ steps.find_files.outputs.updates_json }} s3://${{ secrets.R2_BUCKET_NAME }}/ --endpoint-url $R2_ENDPOINT --content-type "application/json"
          aws s3 cp ${{ steps.find_files.outputs.update_xml }} s3://${{ secrets.R2_BUCKET_NAME }}/ --endpoint-url $R2_ENDPOINT --content-type "application/xml"

      - name: Prune old versions from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for ext in xpi crx; do
            aws s3 ls s3://$R2_BUCKET/ --endpoint-url $R2_ENDPOINT \
              | awk '{print $4}' \
              | grep "^lxd-extension-.*\.$ext$" \
              | sort -V \
              | head -n -5 \
              | while read -r key; do
                  echo "Deleting old version: $key"
                  aws s3 rm s3://$R2_BUCKET/$key --endpoint-url $R2_ENDPOINT
                done
          done

      - name: Push to lxd-tools-build
        run: |
          git clone https://x-access-token:${{ secrets.LXD_TOOLS_BUILD_TOKEN }}@github.com/Unity-Environmental-University/lxd-tools-build.git lxd-tools-build
          cd lxd-tools-build
          git fetch origin
          git checkout stable || git checkout -b stable
          git reset --hard origin/stable 2>/dev/null || true
          rm -rf ./*
          cp -r ../dist/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          # Commit message changed to just the version number
          git commit -m "${{ steps.get_version.outputs.version }}" || echo "No changes to commit"
          # Push to stable
          git push origin stable

      - name: Tag deployed version and create release branch
        working-directory: lxd-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The checkout did not persist credentials; authenticate only for these pushes.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag "$VERSION"
          git push origin "$VERSION"
          git checkout -b "release/$VERSION"
          git push origin "release/$VERSION"
